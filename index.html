<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>Finanças de Alan e Micaeli</h1>
    <nav>
      <button class="aba" onclick="mostrarAba('resumo')">Resumo</button>
      <button class="aba" onclick="mostrarAba('formulario')">Formulário</button>
      <button class="aba" onclick="mostrarAba('historico')">Histórico</button>
      <button class="aba" onclick="mostrarAba('graficos')">Gráficos</button>
      <button class="aba" onclick="mostrarAba('relatorios')">Relatórios</button>
      <button id="toggleDark">🌙 Modo Escuro</button>
    </nav>
  </header>

  <main>
    <section id="resumo" class="aba-conteudo ativo">
      <div class="card">Saldo Atual: R$ <span id="saldo">0</span></div>
      <div class="card">Receitas: R$ <span id="receitas">0</span></div>
      <div class="card">Despesas: R$ <span id="despesas">0</span></div>
      <div class="card">Poupança: R$ <span id="poupanca">0</span></div>
    </section>

    <section id="formulario" class="aba-conteudo">
      <input type="text" id="descricao" placeholder="Descrição">
      <input type="number" id="valor" placeholder="Valor">
      <select id="tipo">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
        <option value="poupanca">Poupança</option>
      </select>
      <button onclick="adicionar()">Adicionar</button>
    </section>

    <section id="historico" class="aba-conteudo">
      <table>
        <thead>
          <tr><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Ações</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </section>

    <section id="graficos" class="aba-conteudo">
      <canvas id="graficoMensal"></canvas>
      <canvas id="graficoPizza"></canvas>
      <canvas id="graficoLinha"></canvas>
      <canvas id="graficoEvolucao"></canvas>
      <canvas id="graficoSaldo"></canvas>
    </section>

    <section id="relatorios" class="aba-conteudo">
      <label for="mes">Mês:</label>
      <select id="mes">
        <option value="1">Janeiro</option>
        <option value="2">Fevereiro</option>
        <option value="3">Março</option>
        <option value="4">Abril</option>
        <option value="5">Maio</option>
        <option value="6">Junho</option>
        <option value="7">Julho</option>
        <option value="8">Agosto</option>
        <option value="9">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
      </select>

      <label for="ano">Ano:</label>
      <input type="number" id="ano" value="2026" min="2000" max="2100">

      <button onclick="filtrarPorMes()">Filtrar</button>
      <button onclick="gerarPDF()">Gerar PDF</button>
      <button onclick="gerarPlanilha()">Gerar Planilha</button>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    // Alternar modo escuro
    document.getElementById("toggleDark").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const btn = document.getElementById("toggleDark");
      if (document.body.classList.contains("dark-mode")) {
        btn.textContent = "☀️ Modo Claro";
      } else {
        btn.textContent = "🌙 Modo Escuro";
      }
    });
  </script>
</body>
</html>
